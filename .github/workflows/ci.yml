name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-base:
    name: Base install (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip uv

      - name: Sync base environment without dev or MCP extras
        run: |
          uv sync --no-dev

      - name: Install test runner dependencies only
        run: |
          uv pip install --python .venv/bin/python pytest pytest-asyncio

      - name: Verify MCP deps are not installed by default
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util
          import mtgjson_sdk

          assert importlib.util.find_spec("fastmcp") is None, "fastmcp should remain optional"
          print("Base SDK import succeeded without optional MCP deps.")
          PY

      - name: Run base-compatible test subset
        run: |
          .venv/bin/pytest tests/test_cache.py tests/test_cards.py tests/test_client.py tests/test_prices.py tests/test_sealed.py -q

  test-mcp-extra:
    name: MCP extra (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip uv

      - name: Sync environment with MCP extra only
        run: |
          uv sync --no-dev --extra mcp

      - name: Install MCP test runner dependencies only
        run: |
          uv pip install --python .venv/bin/python pytest pytest-asyncio

      - name: Verify MCP import surfaces
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util
          import mtgjson_sdk.mcp.server as nested_mcp_server
          import mtgjson_sdk.mcp_server as shim_mcp_server

          assert importlib.util.find_spec("fastmcp") is not None
          assert nested_mcp_server.create_mcp_server is shim_mcp_server.create_mcp_server
          assert callable(nested_mcp_server.main)
          print("MCP extra import surface is available.")
          PY

      - name: Run MCP server tests
        run: |
          .venv/bin/pytest tests/test_mcp_server.py -q

  test-dev-full:
    name: Dev/full install (py3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip uv

      - name: Sync full dev environment with MCP extra
        run: |
          uv sync --group dev --extra mcp

      - name: Verify full dev extras
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("fastmcp") is not None
          assert importlib.util.find_spec("pyarrow") is not None
          print("Full dev environment includes MCP and parquet dependencies.")
          PY

      - name: Run full test suite
        run: |
          .venv/bin/pytest -q

name: Container

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional semver tag to publish, for example v0.1.2.
        required: false
        type: string

jobs:
  build-test:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    outputs:
      server_name: ${{ steps.metadata.outputs.server_name }}
      server_version: ${{ steps.metadata.outputs.server_version }}
      repository_url: ${{ steps.metadata.outputs.repository_url }}
      image_identifier: ${{ steps.metadata.outputs.image_identifier }}
      image_repository: ${{ steps.metadata.outputs.image_repository }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      github_repository: ${{ steps.metadata.outputs.github_repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate committed release metadata
        id: metadata
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
        shell: bash
        run: |
          args=(--github-output "$GITHUB_OUTPUT")
          expected_version=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            expected_version="${GITHUB_REF#refs/tags/v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${RELEASE_TAG_INPUT}" ]]; then
            if [[ ! "${RELEASE_TAG_INPUT}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Manual release_tag must be semver-compatible, for example v0.1.2."
              exit 1
            fi
            expected_version="${RELEASE_TAG_INPUT#v}"
          fi
          if [[ -n "${expected_version}" ]]; then
            args+=(--expected-version "${expected_version}")
          fi
          python scripts/validate_release_metadata.py "${args[@]}"

      - name: Confirm publish-capable runs use the canonical repository
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_REPOSITORY: ${{ steps.metadata.outputs.github_repository }}
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"

      - name: Confirm manual publish runs from main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "main"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          tags: mtgjson-sdk:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.metadata.outputs.server_version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z

      - name: Verify image metadata and host contract
        env:
          SERVER_NAME: ${{ steps.metadata.outputs.server_name }}
          SERVER_VERSION: ${{ steps.metadata.outputs.server_version }}
          REPOSITORY_URL: ${{ steps.metadata.outputs.repository_url }}
        shell: bash
        run: |
          test "$(docker inspect --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' mtgjson-sdk:test)" = "$SERVER_NAME"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' mtgjson-sdk:test)" = "$SERVER_VERSION"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' mtgjson-sdk:test)" = "$REPOSITORY_URL"

          image_user="$(docker inspect --format '{{ .Config.User }}' mtgjson-sdk:test)"
          test -n "$image_user"
          test "$image_user" != "0"
          test "$image_user" != "root"
          test "$(docker inspect --format '{{ json .Config.Entrypoint }}' mtgjson-sdk:test)" = '["mtgjson-mcp"]'

      - name: Smoke CLI contract
        env:
          SERVER_VERSION: ${{ steps.metadata.outputs.server_version }}
        shell: bash
        run: |
          docker run --rm mtgjson-sdk:test --help > help.txt
          grep -q -- '--transport' help.txt
          grep -q 'Use stdio' help.txt
          grep -q 'MTGJSON_MCP_TRANSPORT' help.txt
          grep -q 'MTGJSON_MCP_CACHE_DIR' help.txt

          docker run --rm mtgjson-sdk:test --version > version.txt
          grep -qx "mtgjson-mcp $SERVER_VERSION" version.txt

      - name: Scan container image
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/" \
            aquasec/trivy:0.69.3 \
            image \
            --scanners vuln \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            mtgjson-sdk:test

  publish-image:
    name: Publish Container Image
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    outputs:
      image_identifier: ${{ needs.build-test.outputs.image_identifier }}
      server_version: ${{ needs.build-test.outputs.server_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set build timestamp
        id: build-date
        shell: bash
        run: |
          echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.build-test.outputs.image_repository }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=${{ needs.build-test.outputs.server_version }}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ needs.build-test.outputs.server_version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}

  publish-mcp-registry:
    name: Publish MCP Registry Metadata
    if: needs.publish-image.result == 'success'
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate committed release metadata
        shell: bash
        run: |
          python scripts/validate_release_metadata.py \
            --expected-version "${{ needs.publish-image.outputs.server_version }}"

      - name: Verify published image is publicly accessible
        env:
          IMAGE_IDENTIFIER: ${{ needs.publish-image.outputs.image_identifier }}
        shell: bash
        run: |
          for attempt in {1..6}; do
            if docker manifest inspect "$IMAGE_IDENTIFIER" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Published image must be anonymously accessible before registry publish: $IMAGE_IDENTIFIER"
          exit 1

      - name: Install mcp-publisher
        shell: bash
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish
